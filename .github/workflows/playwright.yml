name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      CI: true
      JUICESHOP_USERNAME: ${{ secrets.JUICESHOP_USERNAME }}
      JUICESHOP_PASSWORD: ${{ secrets.JUICESHOP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps msedge

      - name: Run API Tests
        run: npx playwright test

      - name: Run Cucumber UI Tests
        run: npm test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
